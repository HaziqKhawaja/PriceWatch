[project]
name = "pricewatch"
version = "0.1.0"
description = "REST API that tracks price and stock of products across retailers"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mock_retailers"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# raised to 85 in milestone 7
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
branch = true
omit = ["alembic/*", "mock_retailers/*"]
